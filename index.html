<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Praktikum Pemrograman Basis Data — Modul II: Data Manipulation Language (DML)</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- Solar Icons via Official Iconify Web Component on jsDelivr CDN -->
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            canvas: '#F9F9FB',
            ink: '#111827',
            emeraldAccent: '#059669',
            emeraldBright: '#10B981',
          }
        }
      }
    };
  </script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #F9F9FB;
      color: #111827;
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    iconify-icon {
      display: inline-block;
      vertical-align: -0.15em;
      flex-shrink: 0;
    }
    /* Reference site decorative pixel dot grid on left and right edges */
    .bg-dot-pattern {
      background-image: radial-gradient(#CBD5E1 1.5px, transparent 1.5px);
      background-size: 20px 20px;
    }
    .bg-subtle-grid {
      background-size: 44px 44px;
      background-image: 
        linear-gradient(to right, rgba(226, 232, 240, 0.45) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(226, 232, 240, 0.45) 1px, transparent 1px);
    }

    /* Smooth & Expressive Slide Transitions */
    @keyframes slideEnterNext {
      0% {
        opacity: 0;
        transform: translateX(48px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    @keyframes slideEnterPrev {
      0% {
        opacity: 0;
        transform: translateX(-48px) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }
    @keyframes popBounce {
      0% { transform: scale(0.92); opacity: 0; }
      65% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes floatBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes disasterShake {
      0%, 100% { transform: translateX(0); }
      15% { transform: translateX(-8px); }
      30% { transform: translateX(8px); }
      45% { transform: translateX(-6px); }
      60% { transform: translateX(6px); }
      75% { transform: translateX(-3px); }
    }
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
      }
    }
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes eqBar1 {
      0%, 100% { height: 8px; }
      50% { height: 28px; }
    }
    @keyframes eqBar2 {
      0%, 100% { height: 24px; }
      33% { height: 8px; }
      66% { height: 32px; }
    }
    @keyframes eqBar3 {
      0%, 100% { height: 12px; }
      40% { height: 30px; }
      80% { height: 10px; }
    }

    .animate-slide-next {
      animation: slideEnterNext 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .animate-slide-prev {
      animation: slideEnterPrev 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .animate-pop {
      animation: popBounce 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    .animate-float {
      animation: floatBob 3.2s ease-in-out infinite;
    }
    .animate-shake {
      animation: disasterShake 0.5s ease-in-out;
    }
    .spin-vinyl {
      animation: spinSlow 4.5s linear infinite;
    }
    .eq-bar-1 { animation: eqBar1 0.65s ease-in-out infinite; }
    .eq-bar-2 { animation: eqBar2 0.55s ease-in-out infinite; }
    .eq-bar-3 { animation: eqBar3 0.75s ease-in-out infinite; }
    .pulse-emerald {
      animation: pulseGlow 2s infinite;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.45);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 0.75);
    }
    /* High-visibility Projector-friendly SQL font size */
    .sql-textarea {
      caret-color: #10B981;
      line-height: 1.62;
      tab-size: 2;
      font-size: 15.5px;
      font-weight: 600;
    }
    .sql-textarea:focus {
      outline: none;
    }
    .sql-code-pre {
      font-size: 15.5px;
      line-height: 1.62;
      font-weight: 600;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center relative select-none">

  <!-- Decorative Pixel Dot Columns on Left & Right Edges (Reference Site Signature) -->
  <div class="fixed inset-y-0 left-0 w-10 md:w-16 bg-dot-pattern opacity-65 pointer-events-none z-0"></div>
  <div class="fixed inset-y-0 right-0 w-10 md:w-16 bg-dot-pattern opacity-65 pointer-events-none z-0"></div>
  <div class="fixed inset-0 bg-subtle-grid pointer-events-none z-0 opacity-60"></div>

  <!-- Minimalist Top Progress Line Only (No Menus or Buttons in Header) -->
  <div class="fixed top-0 left-0 right-0 h-1.5 bg-slate-200/80 z-40 overflow-hidden">
    <div id="topProgressBar" class="h-full bg-emerald-600 transition-all duration-300 ease-out" style="width: 5%"></div>
  </div>

  <!-- Main Slide Viewport -->
  <main class="flex-1 flex flex-col justify-center relative z-10 max-w-[1440px] w-full mx-auto px-4 sm:px-8 lg:px-12 py-6 md:py-8 select-text">
    <div id="slideViewport" class="w-full min-h-[82vh] flex flex-col justify-center">
      <!-- Populated dynamically by renderCurrentSlide() -->
    </div>
  </main>

  <!-- Toast Notification with Solar Icon -->
  <div id="toastNotice" class="fixed top-6 right-6 z-50 hidden bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl border-2 border-emerald-400 text-sm sm:text-base font-mono font-bold flex items-center gap-2.5 animate-pop">
    <iconify-icon icon="solar:check-circle-bold-duotone" class="text-emerald-400 text-xl"></iconify-icon>
    <span id="toastMessage">Kode SQL berhasil dijalankan!</span>
  </div>

    function executeSqlScript(rawSql) {
      const logs = [];
      const resultSets = [];
      let reactionSolar = 'check-circle-bold-duotone';
      let reactionState = 'ok'; // 'ok' | 'error' | 'panic' | 'relieved'
      let triggerShake = false;

      const cleaned = rawSql
        .replace(/\/\*[\s\S]*?\*\//g, '')
        .split('\n')
        .map(line => line.replace(/--.*$/, '').trim())
        .join('\n')
        .trim();

      if (!cleaned) {
        return {
          ok: false,
          logs: [{ type: 'warn', text: 'Kotak editor SQL masih kosong. Ketik perintah SQL terlebih dahulu.' }],
          resultSets,
          reactionSolar: 'question-circle-bold-duotone',
          reactionState: 'error',
          triggerShake: false
        };
      }

      const statements = cleaned
        .replace(/\bGO\b/gi, ';')
        .split(';')
        .map(s => s.trim())
        .filter(Boolean);

      let hadError = false;

      for (const stmt of statements) {
        const upper = stmt.toUpperCase().replace(/\s+/g, ' ').trim();

        const printMatch = stmt.match(/^PRINT\s+'([^']*)'/i);
        if (printMatch) {
          logs.push({ type: 'print', text: printMatch[1] });
          continue;
        }

        if (
          upper.startsWith('IF DB_ID') ||
          upper.startsWith('CREATE DATABASE') ||
          upper.startsWith('USE ')
        ) {
          if (upper.includes('CREATE DATABASE TOKORETAILDB')) {
            resetDatabase('empty');
            logs.push({ type: 'ok', text: 'Database TokoRetailDB berhasil dibuat ulang (bersih & siap diisi).' });
          }
          continue;
        }

        if (upper.startsWith('CREATE TABLE PRODUKARSIP')) {
          DB_STATE.produkArsipCreated = true;
          DB_STATE.tables.ProdukArsip = [];
          logs.push({ type: 'ok', text: 'Tabel ProdukArsip berhasil dibuat.' });
          continue;
        }

        if (upper.startsWith('CREATE TABLE')) {
          const tblMatch = stmt.match(/CREATE\s+TABLE\s+(\w+)/i);
          const tblName = tblMatch ? tblMatch[1] : 'Tabel';
          logs.push({ type: 'ok', text: `Struktur tabel ${tblName} beserta Constraint DDL siap digunakan.` });
          continue;
        }

        if (upper.startsWith('BEGIN TRAN')) {
          if (!DB_STATE.inTransaction) {
            DB_STATE.snapshot = {
              identities: deepClone(DB_STATE.identities),
              tables: deepClone(DB_STATE.tables),
              produkArsipCreated: DB_STATE.produkArsipCreated
            };
            DB_STATE.inTransaction = true;
          }
          logs.push({ type: 'tran', text: 'BEGIN TRANSACTION: Zona aman dimulai! Perubahan setelah ini bersifat sementara (belum permanen).' });
          continue;
        }

        if (upper.startsWith('COMMIT')) {
          if (DB_STATE.inTransaction) {
            DB_STATE.inTransaction = false;
            DB_STATE.snapshot = null;
            reactionSolar = 'verified-check-bold-duotone';
            logs.push({ type: 'ok', text: 'COMMIT TRANSACTION: Semua perubahan di zona aman telah disimpan secara PERMANEN.' });
          } else {
            logs.push({ type: 'info', text: 'COMMIT TRANSACTION: Perubahan sudah bersifat permanen.' });
          }
          continue;
        }

        if (upper.startsWith('ROLLBACK')) {
          if (DB_STATE.inTransaction && DB_STATE.snapshot) {
            DB_STATE.identities = deepClone(DB_STATE.snapshot.identities);
            DB_STATE.tables = deepClone(DB_STATE.snapshot.tables);
            DB_STATE.produkArsipCreated = DB_STATE.snapshot.produkArsipCreated;
            DB_STATE.inTransaction = false;
            DB_STATE.snapshot = null;
            reactionSolar = 'rewind-back-bold-duotone';
            reactionState = 'relieved';
            logs.push({ type: 'rollback', text: 'ROLLBACK TRANSACTION: Semua perubahan di zona aman DIBATALKAN! Data kembali aman seperti semula.' });
          } else {
            DB_STATE.inTransaction = false;
            DB_STATE.snapshot = null;
            reactionSolar = 'rewind-back-bold-duotone';
            reactionState = 'relieved';
            logs.push({ type: 'rollback', text: 'ROLLBACK TRANSACTION dijalankan: transaksi dibatalkan.' });
          }
          continue;
        }

        if (upper.startsWith('INSERT INTO PRODUKARSIP') && upper.includes('SELECT')) {
          const zeroStockProducts = DB_STATE.tables.Produk.filter(p => Number(p.Stok) === 0);
          let count = 0;
          zeroStockProducts.forEach(p => {
            const exists = DB_STATE.tables.ProdukArsip.some(a => a.ProdukID === p.ProdukID);
            if (!exists) {
              DB_STATE.tables.ProdukArsip.push({
                ProdukID: p.ProdukID,
                SKU: p.SKU,
                NamaProduk: p.NamaProduk,
                Harga: p.Harga,
                TanggalArsip: '2026-11-02'
              });
              count++;
            }
          });
          logs.push({ type: 'ok', text: `(${count} baris disalin) — Produk dengan Stok = 0 berhasil dipindahkan ke ProdukArsip melalui INSERT ... SELECT.` });
          continue;
        }

        if (upper.startsWith('INSERT INTO')) {
          const res = handleInsertStatement(stmt);
          if (!res.ok) {
            hadError = true;
            reactionSolar = 'forbidden-circle-bold-duotone';
            reactionState = 'error';
            triggerShake = true;
            logs.push({ type: 'error', text: res.errorMsg });
            break;
          } else {
            logs.push({ type: 'ok', text: res.logMsg });
          }
          continue;
        }

        if (upper.startsWith('UPDATE ')) {
          const res = handleUpdateStatement(stmt);
          if (!res.ok) {
            hadError = true;
            reactionSolar = 'forbidden-circle-bold-duotone';
            reactionState = 'error';
            triggerShake = true;
            logs.push({ type: 'error', text: res.errorMsg });
            break;
          } else {
            if (res.warningNoWhere) {
              reactionSolar = 'danger-triangle-bold-duotone';
              reactionState = 'panic';
              triggerShake = true;
              logs.push({ type: 'error', text: res.logMsg });
            } else {
              logs.push({ type: 'ok', text: res.logMsg });
            }
          }
          continue;
        }

        if (upper.startsWith('DELETE FROM')) {
          const res = handleDeleteStatement(stmt);
          if (!res.ok) {
            hadError = true;
            reactionSolar = 'forbidden-circle-bold-duotone';
            reactionState = 'error';
            triggerShake = true;
            logs.push({ type: 'error', text: res.errorMsg });
            break;
          } else {
            if (res.warningNoWhere) {
              reactionSolar = 'danger-triangle-bold-duotone';
              reactionState = 'panic';
              triggerShake = true;
              logs.push({ type: 'error', text: res.logMsg });
            } else {
              logs.push({ type: 'ok', text: res.logMsg });
            }
          }
          continue;
        }

        if (upper.startsWith('SELECT ')) {
          const sel = handleSelectStatement(stmt);
          resultSets.push(sel);
          continue;
        }

        logs.push({ type: 'info', text: `Dieksekusi: ${stmt.slice(0, 60)}...` });
      }

      return { ok: !hadError, logs, resultSets, reactionSolar, reactionState, triggerShake };
    }

    function renderLogItemHtml(logObj) {
      if (typeof logObj === 'string') {
        return `<div class="text-emerald-300 font-semibold">${logObj}</div>`;
      }
      const map = {
        print: { icon: 'chat-round-dots-bold-duotone', color: 'text-sky-300', iconColor: 'text-sky-400' },
        ok: { icon: 'check-circle-bold-duotone', color: 'text-emerald-300 font-semibold', iconColor: 'text-emerald-400' },
        tran: { icon: 'shield-check-bold-duotone', color: 'text-amber-300 font-semibold', iconColor: 'text-amber-400' },
        rollback: { icon: 'rewind-back-bold-duotone', color: 'text-emerald-300 font-bold', iconColor: 'text-emerald-400' },
        error: { icon: 'danger-triangle-bold-duotone', color: 'text-red-300 font-bold whitespace-pre-line', iconColor: 'text-red-400' },
        warn: { icon: 'danger-circle-bold-duotone', color: 'text-amber-300 font-semibold', iconColor: 'text-amber-400' },
        info: { icon: 'info-circle-bold-duotone', color: 'text-slate-300', iconColor: 'text-slate-400' }
      };
      const cfg = map[logObj.type] || map.info;
      return `
        <div class="flex items-start gap-2 ${cfg.color}">
          ${sIcon(cfg.icon, 'text-base mt-0.5 ' + cfg.iconColor)}
          <span>${logObj.text}</span>
        </div>
      `;
    }

    function parseSqlValueTuples(valuesPart) {
      const tuples = [];
      const regex = /\(([^()]+)\)/g;
      let match;
      while ((match = regex.exec(valuesPart)) !== null) {
        const rawItems = match[1].split(',').map(x => x.trim());
        const parsed = rawItems.map(val => {
          if (/^NULL$/i.test(val)) return null;
          if ((val.startsWith("'") && val.endsWith("'")) || (val.startsWith('"') && val.endsWith('"'))) {
            return val.slice(1, -1);
          }
          const num = Number(val);
          return Number.isNaN(num) ? val : num;
        });
        tuples.push(parsed);
      }
      return tuples;
    }

    function handleInsertStatement(stmt) {
      const m = stmt.match(/INSERT\s+INTO\s+(\w+)\s*\(([^)]+)\)\s*VALUES\s*([\s\S]+)$/i);
      if (!m) {
        return {
          ok: false,
          errorMsg: 'Msg 102: Sintaks INSERT belum sesuai. Gunakan format: INSERT INTO NamaTabel (Kolom1, Kolom2) VALUES (...);'
        };
      }
      const tableName = m[1].trim();
      const cols = m[2].split(',').map(c => c.trim());
      const tuples = parseSqlValueTuples(m[3]);

      if (/^Pelanggan$/i.test(tableName)) {
        for (const t of tuples) {
          const rowObj = {};
          cols.forEach((c, idx) => { rowObj[c] = t[idx] !== undefined ? t[idx] : null; });

          if (!rowObj.NamaDepan) {
            return {
              ok: false,
              errorMsg: "Msg 515 (NOT NULL Constraint): Kolom 'NamaDepan' wajib diisi dan tidak boleh bernilai NULL."
            };
          }
          const dupEmail = DB_STATE.tables.Pelanggan.find(
            p => p.Email && rowObj.Email && p.Email.toLowerCase() === String(rowObj.Email).toLowerCase()
          );
          if (dupEmail) {
            return {
              ok: false,
              errorMsg: `Msg 2627 (Pelanggaran UNIQUE Constraint):\nAlamat email "${rowObj.Email}" sudah terdaftar milik Budi Santoso! Aturan UNIQUE pada kolom Email menolak duplikasi data.`
            };
          }

          DB_STATE.tables.Pelanggan.push({
            PelangganID: DB_STATE.identities.Pelanggan++,
            NamaDepan: rowObj.NamaDepan,
            NamaBelakang: rowObj.NamaBelakang ?? null,
            Email: rowObj.Email,
            NoTelepon: rowObj.NoTelepon ?? null,
            TanggalDaftar: '2026-11-02'
          });
        }
        return { ok: true, logMsg: `(${tuples.length} row(s) affected) — Data pelanggan baru berhasil ditambahkan ke tabel Pelanggan.` };
      }

      if (/^KategoriProduk$/i.test(tableName)) {
        for (const t of tuples) {
          const rowObj = {};
          cols.forEach((c, idx) => { rowObj[c] = t[idx]; });
          const dupKat = DB_STATE.tables.KategoriProduk.find(
            k => k.NamaKategori.toLowerCase() === String(rowObj.NamaKategori).toLowerCase()
          );
          if (dupKat) {
            return {
              ok: false,
              errorMsg: `Msg 2627 (Pelanggaran UNIQUE Constraint): Kategori "${rowObj.NamaKategori}" sudah ada di dalam tabel KategoriProduk.`
            };
          }
          DB_STATE.tables.KategoriProduk.push({
            KategoriID: DB_STATE.identities.KategoriProduk++,
            NamaKategori: rowObj.NamaKategori
          });
        }
        return { ok: true, logMsg: `(${tuples.length} row(s) affected) — Kategori baru berhasil ditambahkan ke tabel KategoriProduk.` };
      }

      if (/^Produk$/i.test(tableName)) {
        for (const t of tuples) {
          const rowObj = {};
          cols.forEach((c, idx) => { rowObj[c] = t[idx]; });

          const dupSku = DB_STATE.tables.Produk.find(
            p => p.SKU.toLowerCase() === String(rowObj.SKU).toLowerCase()
          );
          if (dupSku) {
            return {
              ok: false,
              errorMsg: `Msg 2627 (Pelanggaran UNIQUE Constraint): Kode SKU "${rowObj.SKU}" sudah digunakan oleh produk lain.`
            };
          }

          if (Number(rowObj.Harga) < 0) {
            return {
              ok: false,
              errorMsg: `Msg 547 (Pelanggaran CHECK Constraint "CHK_HargaPositif"):\nHarga produk tidak boleh bernilai negatif (${rowObj.Harga} < 0). Operasi INSERT dibatalkan oleh aturan DDL.`
            };
          }

          if (Number(rowObj.Stok) < 0) {
            return {
              ok: false,
              errorMsg: `Msg 547 (Pelanggaran CHECK Constraint "CHK_StokPositif"): Stok produk tidak boleh kurang dari 0.`
            };
          }

          if (rowObj.KategoriID !== null && rowObj.KategoriID !== undefined) {
            const katExists = DB_STATE.tables.KategoriProduk.some(
              k => Number(k.KategoriID) === Number(rowObj.KategoriID)
            );
            if (!katExists) {
              return {
                ok: false,
                errorMsg: `Msg 547 (Pelanggaran FOREIGN KEY Constraint "FK_Produk_Kategori"):\nKategoriID = ${rowObj.KategoriID} tidak ditemukan di tabel KategoriProduk (hanya tersedia ID 1, 2, dan 3).`
              };
            }
          }

          DB_STATE.tables.Produk.push({
            ProdukID: DB_STATE.identities.Produk++,
            SKU: String(rowObj.SKU),
            NamaProduk: String(rowObj.NamaProduk),
            Harga: Number(rowObj.Harga),
            Stok: Number(rowObj.Stok),
            KategoriID: rowObj.KategoriID !== null ? Number(rowObj.KategoriID) : null
          });
        }
        return { ok: true, logMsg: `(${tuples.length} row(s) affected) — Produk baru berhasil ditambahkan ke tabel Produk.` };
      }

      if (/^PesananHeader$/i.test(tableName)) {
        for (const t of tuples) {
          const rowObj = {};
          cols.forEach((c, idx) => { rowObj[c] = t[idx]; });

          const pelExists = DB_STATE.tables.Pelanggan.some(
            p => Number(p.PelangganID) === Number(rowObj.PelangganID)
          );
          if (!pelExists) {
            return {
              ok: false,
              errorMsg: `Msg 547 (FOREIGN KEY Constraint): PelangganID ${rowObj.PelangganID} tidak ditemukan di tabel Pelanggan.`
            };
          }

          const validStatus = ['Baru', 'Proses', 'Selesai', 'Batal'];
          if (!validStatus.includes(rowObj.StatusPesanan)) {
            return {
              ok: false,
              errorMsg: `Msg 547 (CHECK Constraint "CHK_StatusPesanan"): Status pesanan harus bernilai 'Baru', 'Proses', 'Selesai', atau 'Batal'.`
            };
          }

          DB_STATE.tables.PesananHeader.push({
            PesananID: DB_STATE.identities.PesananHeader++,
            PelangganID: Number(rowObj.PelangganID),
            TanggalPesanan: '2026-11-02 10:30:00',
            StatusPesanan: rowObj.StatusPesanan
          });
        }
        return { ok: true, logMsg: `(${tuples.length} row(s) affected) — Pesanan baru berhasil dicatat pada PesananHeader.` };
      }

      return { ok: false, errorMsg: `Tabel ${tableName} tidak ditemukan di TokoRetailDB.` };
    }

    function handleUpdateStatement(stmt) {
      const hasWhere = /\bWHERE\b/i.test(stmt);
      const m = stmt.match(/UPDATE\s+(\w+)\s+SET\s+([\s\S]+?)(?:\s+WHERE\s+([\s\S]+))?$/i);
      if (!m) {
        return { ok: false, errorMsg: 'Sintaks UPDATE tidak valid.' };
      }
      const tableName = m[1].trim();
      const setClause = m[2].trim();
      const whereClause = m[3] ? m[3].trim() : null;

      const tableKey = Object.keys(DB_STATE.tables).find(k => k.toLowerCase() === tableName.toLowerCase());
      if (!tableKey) {
        return { ok: false, errorMsg: `Tabel ${tableName} tidak ditemukan.` };
      }

      const rows = DB_STATE.tables[tableKey];
      const matchedRows = rows.filter(r => matchWhereClause(r, whereClause));

      const assignMatch = setClause.match(/^(\w+)\s*=\s*(.+)$/);
      if (!assignMatch) {
        return { ok: false, errorMsg: 'Klausa SET tidak dikenali.' };
      }
      const colName = assignMatch[1].trim();
      const expr = assignMatch[2].trim();

      for (const row of matchedRows) {
        if (/Harga\s*\*\s*([\d.]+)/i.test(expr)) {
          const factor = Number(expr.match(/Harga\s*\*\s*([\d.]+)/i)[1]);
          row[colName] = Math.round(Number(row.Harga) * factor * 100) / 100;
        } else if (/^'.*'$/.test(expr)) {
          row[colName] = expr.slice(1, -1);
        } else if (/^NULL$/i.test(expr)) {
          row[colName] = null;
        } else {
          const numVal = Number(expr);
          if (colName === 'Harga' && numVal < 0) {
            return {
              ok: false,
              errorMsg: 'Msg 547 (CHECK Constraint "CHK_HargaPositif"): Harga tidak boleh diubah menjadi negatif.'
            };
          }
          if (colName === 'Stok' && numVal < 0) {
            return {
              ok: false,
              errorMsg: 'Msg 547 (CHECK Constraint "CHK_StokPositif"): Stok tidak boleh diubah menjadi negatif.'
            };
          }
          row[colName] = Number.isNaN(numVal) ? expr : numVal;
        }
      }

      if (!hasWhere) {
        return {
          ok: true,
          warningNoWhere: true,
          logMsg: `PERINGATAN BENCANA (${matchedRows.length} baris berubah!) — UPDATE dijalankan TANPA klausa WHERE sehingga seluruh baris pada tabel ${tableKey} ikut berubah! Segera jalankan ROLLBACK TRANSACTION!`
        };
      }

      return {
        ok: true,
        warningNoWhere: false,
        logMsg: `(${matchedRows.length} row(s) affected) — Data pada tabel ${tableKey} berhasil diperbarui secara spesifik.`
      };
    }

    function handleDeleteStatement(stmt) {
      const hasWhere = /\bWHERE\b/i.test(stmt);
      const m = stmt.match(/DELETE\s+FROM\s+(\w+)(?:\s+WHERE\s+([\s\S]+))?$/i);
      if (!m) {
        return { ok: false, errorMsg: 'Sintaks DELETE tidak valid.' };
      }
      const tableName = m[1].trim();
      const whereClause = m[2] ? m[2].trim() : null;

      const tableKey = Object.keys(DB_STATE.tables).find(k => k.toLowerCase() === tableName.toLowerCase());
      if (!tableKey) {
        return { ok: false, errorMsg: `Tabel ${tableName} tidak ditemukan.` };
      }

      const rows = DB_STATE.tables[tableKey];
      const toDelete = rows.filter(r => matchWhereClause(r, whereClause));

      if (tableKey === 'Pelanggan') {
        for (const pel of toDelete) {
          const childOrder = DB_STATE.tables.PesananHeader.find(
            ph => Number(ph.PelangganID) === Number(pel.PelangganID)
          );
          if (childOrder) {
            return {
              ok: false,
              errorMsg: `Msg 547 (Pelanggaran FOREIGN KEY "FK_Pesanan_Pelanggan"):\nData pelanggan "${pel.NamaDepan} ${pel.NamaBelakang || ''}" (PelangganID = ${pel.PelangganID}) TIDAK DAPAT DIHAPUS karena masih dirujuk oleh data pesanan aktif (PesananID = ${childOrder.PesananID}) di tabel PesananHeader.`
            };
          }
        }
      }

      if (tableKey === 'KategoriProduk') {
        for (const kat of toDelete) {
          const childProd = DB_STATE.tables.Produk.find(
            p => Number(p.KategoriID) === Number(kat.KategoriID)
          );
          if (childProd) {
            return {
              ok: false,
              errorMsg: `Msg 547 (FOREIGN KEY "FK_Produk_Kategori"): Kategori ini tidak dapat dihapus karena masih digunakan oleh produk aktif.`
            };
          }
        }
      }

      DB_STATE.tables[tableKey] = rows.filter(r => !matchWhereClause(r, whereClause));
      return {
        ok: true,
        warningNoWhere: !hasWhere,
        logMsg: !hasWhere
          ? `PERINGATAN! (${toDelete.length} baris terhapus!) DELETE tanpa klausa WHERE menghapus seluruh isi tabel ${tableKey}!`
          : `(${toDelete.length} row(s) affected) — Baris berhasil dihapus dari tabel ${tableKey}.`
      };
    }

    function matchWhereClause(row, whereClause) {
      if (!whereClause) return true;
      const condMatch = whereClause.match(/^(\w+)\s*=\s*(.+)$/);
      if (!condMatch) return true;
      const col = condMatch[1].trim();
      let val = condMatch[2].trim();
      if ((val.startsWith("'") && val.endsWith("'")) || (val.startsWith('"') && val.endsWith('"'))) {
        val = val.slice(1, -1);
      }
      const key = Object.keys(row).find(k => k.toLowerCase() === col.toLowerCase());
      if (!key) return false;
      return String(row[key]).toLowerCase() === String(val).toLowerCase();
    }

    function handleSelectStatement(stmt) {
      if (/JOIN\s+KategoriProduk/i.test(stmt)) {
        const joinedRows = DB_STATE.tables.Produk.map(p => {
          const kat = DB_STATE.tables.KategoriProduk.find(k => Number(k.KategoriID) === Number(p.KategoriID));
          return {
            ProdukID: p.ProdukID,
            SKU: p.SKU,
            NamaProduk: p.NamaProduk,
            Harga: p.Harga,
            Stok: p.Stok,
            KategoriID: p.KategoriID,
            NamaKategori: kat ? kat.NamaKategori : 'NULL'
          };
        });
        return { title: 'Hasil Gabungan: Produk JOIN KategoriProduk', rows: joinedRows };
      }

      const m = stmt.match(/SELECT\s+([\s\S]+?)\s+FROM\s+(\w+)(?:\s+WHERE\s+([\s\S]+))?$/i);
      if (!m) {
        return { title: 'Hasil SELECT', rows: [] };
      }
      const colsPart = m[1].trim();
      const tableName = m[2].trim();
      const whereClause = m[3] ? m[3].trim() : null;

      const tableKey = Object.keys(DB_STATE.tables).find(k => k.toLowerCase() === tableName.toLowerCase());
      if (!tableKey) {
        return { title: `Tabel ${tableName} tidak ditemukan`, rows: [] };
      }

      const filtered = DB_STATE.tables[tableKey].filter(r => matchWhereClause(r, whereClause));

      if (colsPart === '*') {
        return { title: `Tabel: ${tableKey}`, rows: deepClone(filtered) };
      }

      const requestedCols = colsPart.split(',').map(c => c.trim());
      const projected = filtered.map(r => {
        const obj = {};
        requestedCols.forEach(c => {
          const actualKey = Object.keys(r).find(k => k.toLowerCase() === c.toLowerCase()) || c;
          obj[actualKey] = r[actualKey];
        });
        return obj;
      });
      return { title: `Tabel: ${tableKey} (${colsPart})`, rows: projected };
    }

    function showToast(msg) {
      const toast = document.getElementById('toastNotice');
      const text = document.getElementById('toastMessage');
      if (!toast || !text) return;
      text.textContent = msg;
      toast.classList.remove('hidden');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
      }, 2500);
    }

    function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('Kode SQL berhasil disalin!');
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('Kode SQL berhasil disalin!');
      } catch (e) {
        showToast('Gagal menyalin teks.');
      }
      document.body.removeChild(ta);
    }

    function goToSlide(index) {
      if (index < 0 || index >= SLIDES.length) return;
      slideDirection = index >= currentSlideIndex ? 'next' : 'prev';
      currentSlideIndex = index;
      renderCurrentSlide();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function nextSlide() {
      if (currentSlideIndex < SLIDES.length - 1) {
        goToSlide(currentSlideIndex + 1);
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        goToSlide(currentSlideIndex - 1);
      }
    }

    // =========================================================================
    // 6. MAIN RENDER & EVENT LISTENERS
    // =========================================================================
    function renderCurrentSlide() {
      const viewport = document.getElementById('slideViewport');
      const progressBar = document.getElementById('topProgressBar');

      const slide = SLIDES[currentSlideIndex];
      if (!viewport || !slide) return;

      if (progressBar) {
        const pct = ((currentSlideIndex + 1) / SLIDES.length) * 100;
        progressBar.style.width = `${pct}%`;
      }

      let html = '';
      switch (slide.type) {
        case 'cover':
          html = renderSlideCover();
          break;
        case 'review_cards':
          html = renderSlideReviewCards();
          break;
        case 'analogy_cabinet':
          html = renderSlideAnalogyCabinet();
          break;
        case 'goals_prereqs':
          html = renderSlideGoalsPrereqs();
          break;
        case 'dml_commands':
          html = renderSlideDmlCommands();
          break;
        case 'dml_vs_ddl':
          html = renderSlideDmlVsDdl();
          break;
        case 'transaction_stack':
          html = renderSlideTransactionStack();
          break;
        case 'schema_visualizer':
          html = renderSlideSchemaVisualizer();
          break;
        case 'ddl_script_switcher':
          html = renderSlideDdlScriptSwitcher();
          break;
        case 'sql_lab':
          html = renderSlideSqlLab(slide);
          break;
        case 'interactive_quiz':
          html = renderSlideInteractiveQuiz();
          break;
        case 'lofi_sandbox_room':
          html = renderSlideLofiSandboxRoom();
          break;
        case 'summary_closing':
          html = renderSlideSummaryClosing();
          break;
      }

      viewport.className = 'w-full min-h-[82vh] flex flex-col justify-center ' +
        (slideDirection === 'next' ? 'animate-slide-next' : 'animate-slide-prev');
      viewport.innerHTML = html;

      attachSlideListeners(slide);
    }

    function attachSlideListeners(slide) {
      // Slide 02 cards
      document.querySelectorAll('[data-review-card]').forEach(card => {
        card.addEventListener('click', () => {
          const id = Number(card.getAttribute('data-review-card'));
          UI_STATE.revealedCardsSlide2[id] = !UI_STATE.revealedCardsSlide2[id];
          renderCurrentSlide();
        });
      });

      document.getElementById('btnRevealAllSlide2')?.addEventListener('click', () => {
        const allOpen = UI_STATE.revealedCardsSlide2[1] && UI_STATE.revealedCardsSlide2[2] && UI_STATE.revealedCardsSlide2[3];
        UI_STATE.revealedCardsSlide2 = { 1: !allOpen, 2: !allOpen, 3: !allOpen };
        renderCurrentSlide();
      });

      // Slide 03 Interactive Cabinet Simulator
      document.querySelectorAll('[data-cab-action]').forEach(btn => {
        btn.addEventListener('click', () => {
          const act = btn.getAttribute('data-cab-action');
          if (act === 'insert') {
            const newId = 1001 + UI_STATE.cabinetItems.length;
            UI_STATE.cabinetItems.push({
              id: newId,
              icon: 'headphones-round-sound-bold-duotone',
              name: 'Headset Studio Pro',
              price: 'Rp 350.000',
              stock: 40
            });
            UI_STATE.cabinetLastAction = `INSERT INTO Produk VALUES ('Headset Studio Pro', 350000, 40); — Baris baru ditambahkan.`;
          } else if (act === 'update') {
            if (UI_STATE.cabinetItems.length > 0) {
              UI_STATE.cabinetItems[0].price = 'Rp 16.500.000 (+10%)';
              UI_STATE.cabinetLastAction = `UPDATE Produk SET Harga = Harga * 1.10 WHERE ProdukID = ${UI_STATE.cabinetItems[0].id}; — Harga diperbarui.`;
            }
          } else if (act === 'delete') {
            if (UI_STATE.cabinetItems.length > 0) {
              const removed = UI_STATE.cabinetItems.pop();
              UI_STATE.cabinetLastAction = `DELETE FROM Produk WHERE ProdukID = ${removed.id}; — Baris "${removed.name}" dihapus.`;
            }
          } else if (act === 'reset') {
            UI_STATE.cabinetItems = [
              { id: 1001, icon: 'laptop-minimalistic-bold-duotone', name: 'Laptop Pro 14 inch', price: 'Rp 15.000.000', stock: 50 },
              { id: 1002, icon: 't-shirt-bold-duotone', name: 'Kaos Polos Putih', price: 'Rp 75.000', stock: 200 },
              { id: 1003, icon: 'book-2-bold-duotone', name: 'Dasar-Dasar SQL', price: 'Rp 120.000', stock: 100 }
            ];
            UI_STATE.cabinetLastAction = 'Isi tabel dikembalikan ke kondisi awal.';
          }
          renderCurrentSlide();
        });
      });

      // Slide 05 DML Commands + Live Mini Runner
      document.querySelectorAll('[data-cmd-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          UI_STATE.activeCommandTab = btn.getAttribute('data-cmd-tab');
          UI_STATE.theoryMiniSqlOut = null;
          renderCurrentSlide();
        });
      });

      const theoryEditor = document.getElementById('theoryMiniSqlEditor');
      if (theoryEditor) {
        const miniKey = 'theory_cmd_' + (UI_STATE.activeCommandTab || 'INSERT');
        theoryEditor.addEventListener('input', () => {
          UI_STATE.labSqlCode[miniKey] = theoryEditor.value;
        });
      }

      document.getElementById('btnRunTheoryMini')?.addEventListener('click', () => {
        const miniKey = 'theory_cmd_' + (UI_STATE.activeCommandTab || 'INSERT');
        const sqlText = theoryEditor ? theoryEditor.value : UI_STATE.labSqlCode[miniKey];
        UI_STATE.theoryMiniSqlOut = executeSqlScript(sqlText);
        renderCurrentSlide();
      });

      document.getElementById('btnResetTheoryMini')?.addEventListener('click', () => {
        resetDatabase('latihan2');
        UI_STATE.theoryMiniSqlOut = null;
        showToast('Database di-reset ke kondisi awal!');
        renderCurrentSlide();
      });

      // Slide 07 Stack Simulator
      document.querySelectorAll('[data-stack-cmd]').forEach(btn => {
        btn.addEventListener('click', () => {
          const cmd = btn.getAttribute('data-stack-cmd');
          if (cmd === 'begin') {
            UI_STATE.stackSimState = 'begin';
            UI_STATE.stackSimStok.temp = UI_STATE.stackSimStok.permanent;
          } else if (cmd === 'disaster') {
            if (UI_STATE.stackSimStok.temp === null) {
              UI_STATE.stackSimStok.temp = UI_STATE.stackSimStok.permanent;
            }
            UI_STATE.stackSimState = 'updated_wrong';
            UI_STATE.stackSimStok.temp = 0;
          } else if (cmd === 'rollback') {
            UI_STATE.stackSimState = 'rolled_back';
            UI_STATE.stackSimStok.temp = null;
            UI_STATE.stackSimStok.permanent = 50;
          } else if (cmd === 'commit') {
            if (UI_STATE.stackSimStok.temp !== null) {
              UI_STATE.stackSimStok.permanent = UI_STATE.stackSimStok.temp;
              UI_STATE.stackSimStok.temp = null;
            }
            UI_STATE.stackSimState = 'committed';
          } else if (cmd === 'reset') {
            UI_STATE.stackSimState = 'initial';
            UI_STATE.stackSimStok = { permanent: 50, temp: null };
          }
          renderCurrentSlide();
        });
      });

      document.getElementById('btnNextToDdlScript')?.addEventListener('click', () => nextSlide());

      // Slide 09 DDL Script
      document.querySelectorAll('[data-ddl-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          UI_STATE.activeDdlScriptTab = btn.getAttribute('data-ddl-tab');
          renderCurrentSlide();
        });
      });

      document.getElementById('btnCopyDdlScript')?.addEventListener('click', () => {
        const codeEl = document.getElementById('ddlCodeBlock');
        if (codeEl) copyTextToClipboard(codeEl.textContent);
      });

      document.getElementById('btnRunDdlSetup')?.addEventListener('click', () => {
        resetDatabase('empty');
        showToast('Database TokoRetailDB berhasil disiapkan untuk Latihan 1!');
      });

      // Slides 10–18: SQL Lab
      if (slide.type === 'sql_lab') {
        const slideKey = 'lab_' + slide.labNumber;
        const editor = document.getElementById('labSqlEditor');

        if (editor) {
          editor.addEventListener('input', () => {
            UI_STATE.labSqlCode[slideKey] = editor.value;
          });
        }

        document.querySelectorAll('[data-preset-idx]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-preset-idx'));
            const preset = slide.presets[idx];
            if (preset) {
              UI_STATE.labSqlCode[slideKey] = preset.sql;
              if (!(slide.labNumber === 7 && idx === 2)) {
                resetDatabase(slide.seedBefore);
              }
              UI_STATE.labOutput[slideKey] = executeSqlScript(preset.sql);
              renderCurrentSlide();
            }
          });
        });

        document.getElementById('btnRunLabSql')?.addEventListener('click', () => {
          const sqlText = editor ? editor.value : UI_STATE.labSqlCode[slideKey];
          UI_STATE.labSqlCode[slideKey] = sqlText;
          if (!DB_STATE.inTransaction && slide.labNumber === 1 && DB_STATE.tables.Pelanggan.length > 0 && sqlText.includes('budi.santoso@email.com')) {
            resetDatabase('empty');
          } else if (!DB_STATE.inTransaction && slide.labNumber >= 2 && DB_STATE.tables.Pelanggan.length === 0) {
            resetDatabase(slide.seedBefore);
          }
          UI_STATE.labOutput[slideKey] = executeSqlScript(sqlText);
          renderCurrentSlide();
        });

        document.getElementById('btnResetLabSlide')?.addEventListener('click', () => {
          resetDatabase(slide.seedBefore);
          UI_STATE.labSqlCode[slideKey] = slide.presets[0].sql;
          delete UI_STATE.labOutput[slideKey];
          renderCurrentSlide();
          showToast(`Latihan ${slide.labNumber} di-reset ke kondisi awal.`);
        });

        document.getElementById('btnCopyLabSql')?.addEventListener('click', () => {
          const sqlText = editor ? editor.value : UI_STATE.labSqlCode[slideKey];
          copyTextToClipboard(sqlText);
        });
      }

      // Slide 19: Interactive Quiz
      if (slide.type === 'interactive_quiz') {
        document.querySelectorAll('[data-quiz-scen]').forEach(btn => {
          btn.addEventListener('click', () => {
            UI_STATE.quizSelectedScenario = Number(btn.getAttribute('data-quiz-scen'));
            UI_STATE.quizUserGuess = null;
            UI_STATE.quizSqlOut = null;
            resetDatabase('latihan2');
            renderCurrentSlide();
          });
        });

        document.querySelectorAll('[data-quiz-guess]').forEach(btn => {
          btn.addEventListener('click', () => {
            UI_STATE.quizUserGuess = btn.getAttribute('data-quiz-guess');
            renderCurrentSlide();
          });
        });

        document.getElementById('btnRunQuizProve')?.addEventListener('click', () => {
          resetDatabase('latihan2');
          const scenariosSql = [
            `BEGIN TRANSACTION;\nUPDATE Produk SET Harga = 0;\nSELECT SKU, NamaProduk, Harga FROM Produk;`,
            `INSERT INTO Produk (SKU, NamaProduk, Harga, Stok, KategoriID)\nVALUES ('ERR-99', 'Mouse Wireless', -25000, 5, 1);`,
            `BEGIN TRANSACTION;\nUPDATE Produk SET Stok = 120 WHERE SKU = 'ELEC-001';\nCOMMIT TRANSACTION;\nSELECT SKU, NamaProduk, Stok FROM Produk WHERE SKU = 'ELEC-001';`
          ];
          const sql = scenariosSql[UI_STATE.quizSelectedScenario || 0];
          UI_STATE.quizSqlOut = executeSqlScript(sql);
          renderCurrentSlide();
        });
      }

      // Slide 20: Dedicated Lo-Fi Studio & Free Sandbox
      if (slide.type === 'lofi_sandbox_room') {
        document.getElementById('btnToggleLofi')?.addEventListener('click', () => {
          toggleLofiBeats();
          renderCurrentSlide();
        });

        const slideKey = 'sandbox_free';
        const editor = document.getElementById('sandboxSqlEditor');
        if (editor) {
          editor.addEventListener('input', () => {
            UI_STATE.labSqlCode[slideKey] = editor.value;
          });
        }

        document.getElementById('btnRunSandboxSql')?.addEventListener('click', () => {
          const sqlText = editor ? editor.value : UI_STATE.labSqlCode[slideKey];
          UI_STATE.labSqlCode[slideKey] = sqlText;
          UI_STATE.labOutput[slideKey] = executeSqlScript(sqlText);
          renderCurrentSlide();
        });

        document.querySelectorAll('[data-sandbox-tpl]').forEach(btn => {
          btn.addEventListener('click', () => {
            const tpl = btn.getAttribute('data-sandbox-tpl');
            if (tpl === 'select_all') {
              UI_STATE.labSqlCode[slideKey] = `SELECT * FROM KategoriProduk;\nSELECT * FROM Produk;\nSELECT * FROM Pelanggan;`;
              UI_STATE.labOutput[slideKey] = executeSqlScript(UI_STATE.labSqlCode[slideKey]);
              renderCurrentSlide();
            } else if (tpl === 'reset_db') {
              resetDatabase('latihan2');
              delete UI_STATE.labOutput[slideKey];
              showToast('Database TokoRetailDB di-reset ke kondisi standar.');
              renderCurrentSlide();
            }
          });
        });
      }

      // Slide 21: Closing
      document.getElementById('btnRestartDeck')?.addEventListener('click', () => goToSlide(0));
      document.getElementById('btnBackToLabs')?.addEventListener('click', () => goToSlide(9));
    }

    // =========================================================================
    // 7. LO-FI SYNTHESIZER & KEYBOARD ARROWS
    // =========================================================================
    let audioCtx = null;
    let lofiPlaying = false;
    let lofiInterval = null;

    function toggleLofiBeats() {
      if (lofiPlaying) {
        lofiPlaying = false;
        clearInterval(lofiInterval);
        showToast('Musik Lo-Fi dihentikan.');
        return;
      }

      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        showToast('Audio tidak didukung pada browser ini.');
        return;
      }

      lofiPlaying = true;
      showToast('Lo-Fi Focus Beats diputar.');

      const chords = [
        [261.63, 329.63, 392.00, 493.88],
        [220.00, 261.63, 329.63, 392.00],
        [174.61, 220.00, 261.63, 349.23],
        [196.00, 246.94, 293.66, 349.23]
      ];
      let chordIdx = 0;

      function playChillChord() {
        if (!lofiPlaying || !audioCtx) return;
        const now = audioCtx.currentTime;
        const notes = chords[chordIdx % chords.length];
        chordIdx++;

        notes.forEach(freq => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.025, now + 0.15);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + 2.2);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 2.3);
        });
      }

      playChillChord();
      lofiInterval = setInterval(playChillChord, 2400);
    }

    window.addEventListener('DOMContentLoaded', () => {
      resetDatabase('latihan2');
      renderCurrentSlide();

      window.addEventListener('keydown', (e) => {
        const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : '';
        if (tag === 'TEXTAREA' || tag === 'INPUT' || e.target?.isContentEditable) {
          return;
        }
        if (e.key === 'ArrowRight' || e.key === 'PageDown') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          prevSlide();
        }
      });
    });
  </script>
